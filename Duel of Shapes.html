<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Duel of Shapes</title>
        <style>
            #gameCanvas {
                border: 1px solid black;
                background-color: aqua
            }
        </style>
    </head>
    <body>
        <canvas id="gameCanvas" width="1400" height="700"></canvas>
        <script>
            const canvas = document.getElementById('gameCanvas');
            const canvas_context = canvas.getContext('2d');

            class Entity {
                #shape;
                #color;
                #width;
                #height;
                #step;

                constructor(shape, color, position_x, position_y, width, height) {
                    this.#shape = shape;
                    this.#color = color;
                    this.position_x = position_x;
                    this.position_y = position_y;
                    this.#width = width;
                    this.#height = height;
                }

                getShape() {
                    return this.#shape;
                }
                getColor() {
                    return this.#color;
                }
                getWidth() {
                    return this.#width;
                }
                getHeight() {
                    return this.#height;
                }
                setStep(step) {
                    this.#step = step;
                }
                getStep() {
                    return this.#step;
                }

                draw() {
                    canvas_context.fillStyle = this.getColor();
                    if(this.getShape() === 'triangle') {
                        canvas_context.beginPath();
                        canvas_context.moveTo(this.position_x + this.#width / 2, this.position_y);
                        canvas_context.lineTo(this.position_x, this.position_y + this.#height);
                        canvas_context.lineTo(this.position_x + this.#width, this.position_y + this.#height);
                        canvas_context.lineTo(this.position_x + this.#width / 2, this.position_y);
                        canvas_context.closePath();
                        canvas_context.fill();
                    }
                    else if(this.getShape() === 'circle') {
                        canvas_context.beginPath();
                        canvas_context.arc(this.position_x + this.#width / 2, this.position_y + this.#height / 2, Math.min(this.#width, this.#height) / 2, 0, Math.PI * 2);
                        canvas_context.closePath();
                        canvas_context.fill();
                    }
                    else console.error(`CUSTOM ERROR ALERT — Unknown entity shape: ${this.#shape}.`);
                }

                move(direction) {
                    //canvas_context.clearRect(this.position_x, this.position_y, 100, 100); (AI's suggestion.)
                    if(direction === 'right') this.position_x += this.getStep();
                    else if(direction === 'left') this.position_x -= this.getStep();
                    else if(direction === 'up') this.position_y -= this.getStep();
                    else if(direction === 'down') this.position_y += this.getStep();
                    else console.error(`CUSTOM ERROR ALERT — Unknown direction: ${direction}.`);
                    canvas_context.clearRect(0, 0, canvas.width, canvas.height);
                    this.draw();
                }
            }

            class Character extends Entity {
                constructor(shape, color, position_x, position_y, width, height) {
                    super(shape, color, position_x, position_y, width, height);
                    this.setStep(100);
                }

                lesserSummon() {
                    let summon_color;
                    if(this.getColor() === 'red') summon_color = '#FF7F7F';
                    else if(this.getColor() === 'blue') summon_color = '#1E90FF';
                    else console.error(`CUSTOM ERROR ALERT — Unknown lesser summon color: ${this.getColor()}.`);
                    new Summon(this.getShape(), summon_color, this.position_x + 125, this.position_y + 25, this.getWidth() / 2, this.getHeight() / 2);
                }

                greaterSummon() {
                    let summon_color;
                    if(this.getColor() === 'red') summon_color = '#850101';
                    else if(this.getColor() === 'blue') summon_color = '#00008B';
                    else console.error(`CUSTOM ERROR ALERT — Unknown greater summon color: ${this.getColor()}.`);
                    new GreaterSummon(this.getShape(), summon_color, this.position_x + 125, this.position_y, this.getWidth() / 2, this.getHeight() / 2);
                }
            }

            class Summon extends Entity {
                #isAlive;

                constructor(shape, color, position_x, position_y, width, height) {
                    super(shape, color, position_x, position_y, width, height);
                    this.setStep(10);
                    this.#isAlive = true;
                    this.draw();
                }
                getIsAlive() {
                    return this.#isAlive;
                }

                draw() {
                    super.draw();

                    if(this.getIsAlive() && this.position_x + this.getWidth() < canvas.width / 2) {
                        requestAnimationFrame(() => {
                            this.move('right');
                        });
                    }
                }

                move(direction) {
                    if(direction === 'right') this.position_x += this.getStep();
                    else console.error(`CUSTOM ERROR ALERT — Unknown direction: ${direction}.`);
                    canvas_context.clearRect(0, 0, canvas.width, canvas.height);
                    this.draw();
                }
            }

            class GreaterSummon extends Summon {
                constructor(shape, color, position_x, position_y, width, height) {
                    super(shape, color, position_x, position_y, width, height);
                }

                draw() {
                    canvas_context.fillStyle = this.getColor();
                    if(this.getShape() === 'triangle') {
                        canvas_context.beginPath();
                        canvas_context.moveTo(this.position_x + this.getWidth() / 2, this.position_y);
                        canvas_context.lineTo(this.position_x, this.position_y + this.getHeight());
                        canvas_context.lineTo(this.position_x + this.getWidth(), this.position_y + this.getHeight());
                        canvas_context.lineTo(this.position_x + this.getWidth() / 2, this.position_y);
                        canvas_context.closePath();
                        canvas_context.fill();

                        canvas_context.beginPath();
                        canvas_context.moveTo(this.position_x + this.getWidth() / 2, this.position_y + this.getHeight());
                        canvas_context.lineTo(this.position_x, this.position_y + this.getHeight() * 2);
                        canvas_context.lineTo(this.position_x + this.getWidth(), this.position_y + this.getHeight() * 2);
                        canvas_context.lineTo(this.position_x + this.getWidth() / 2, this.position_y + this.getHeight());
                        canvas_context.closePath();
                        canvas_context.fill();
                    }
                    else if(this.getShape() === 'circle') {
                        canvas_context.beginPath();
                        canvas_context.arc(this.position_x + this.getWidth() / 2, this.position_y + this.getHeight() / 2, Math.min(this.getWidth(), this.getHeight()) / 2, 0, Math.PI * 2);
                        canvas_context.closePath();
                        canvas_context.fill();

                        canvas_context.beginPath();
                        canvas_context.arc(this.position_x + this.getWidth() / 2, this.position_y + this.getHeight() * 1.5, Math.min(this.getWidth(), this.getHeight()) / 2, 0, Math.PI * 2);
                        canvas_context.closePath();
                        canvas_context.fill();
                    }
                    else console.error(`CUSTOM ERROR ALERT — Unknown summon shape: ${this.getShape()}.`);

                    if(this.getIsAlive() && this.position_x + this.getWidth() < canvas.width / 2) {
                        requestAnimationFrame(() => {
                            this.move('right');
                        });
                    }
                }
            }

            const character1 = new Character('circle', 'blue', 0, 0, 100, 100);

            character1.draw(0, 0);

            window.addEventListener('keydown', (event) => {
                if(event.key === 'ArrowRight') {
                    character1.move('right');
                }
                else if(event.key === 'ArrowLeft') {
                    character1.move('left');
                }
                else if(event.key === 'ArrowUp') {
                    character1.move('up');
                }
                else if(event.key === 'ArrowDown') {
                    character1.move('down');
                }

                else if(event.key === 'z') {
                    character1.lesserSummon();
                }
                else if(event.key === 'x') {
                    character1.greaterSummon();
                }
            });
        </script>
    </body>
</html>
