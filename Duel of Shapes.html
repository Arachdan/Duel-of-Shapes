<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Duel of Shapes</title>
        <style>
            #gameCanvas {
                border: 1px solid black;
                background-color: aqua
            }
        </style>
    </head>
    <body>
        <canvas id="gameCanvas" width="1400" height="800"></canvas>
        <script>
            const summons = [];
            const players = [];

            function getRGBAColorValue(target, specific_target, color_number) {
                let color;
                if(target === 'player') color = specific_target.getColor();
                else if(target === 'canvas') {
                    if(specific_target === 'blue') color = canvas.getBlueFieldsColor();
                    else if(specific_target === 'red') color = canvas.getRedFieldsColor();
                }
                else console.error(`CUSTOM ERROR ALERT — Unknown target: ${target} (${specific_target}).`);
                const arrayed_color = color.match(/[\d.]+/g);
                return arrayed_color[color_number]; // The array goes like "R value, G value, B value, A value".
            }

            class GameMaster {
                loop() {
                    /* Update Entities' coordinates — START */
                    for(let i = 0; i < summons.length; i++) {
                        if(summons[i].getPlayerity() === 1) summons[i].move('right');
                        else if(summons[i].getPlayerity() === 2) summons[i].move('left');
                        else console.error(`CUSTOM ERROR ALERT — Unknown playerity: ${summons[i].getPlayerity()}.`);
                    }
                    /* Update Entities' coordinates — END */

                    canvas.clear();

                    /* Draw Entities – START */
                    canvas.drawGameFields();

                    for(let i = 0; i < summons.length; i++) {
                        /*
                            The usage of summons[i].getStep() below is to ensure summon's collision
                            with a wall is somewhat pleasing to the eye (and more realistic-looking).
                        */
                        if(summons[i].getPositionX() + summons[i].getWidth() - summons[i].getStep() < canvas.getWidth() && summons[i].getPositionX() + summons[i].getStep() > 0) summons[i].draw();
                        else {
                            summons.splice(i, 1);
                            i--; // To not skip the summon that shifts into the removed summon's position in the array.
                        }
                    }
                        
                    character1.draw();
                    character2.draw();
                    /* Draw Entities – END */

                    this.checkCollision(summons);
                    this.checkCollision(players);

                    requestAnimationFrame(() => this.loop());
                }

                checkCollision(entity) {
                    for(let i = summons.length - 1; i >= 0; i--) {
                        for(let j = 0; j < entity.length; j++) {
                            if(entity === summons && j > i) continue; // Excludes self-collision case.

                            let gap_radius = 0;
                            if(entity === players) gap_radius = 15;

                            // Checking for "NOT in collision" state.
                            if(
                                (entity[j].getPositionX() > summons[i].getPositionX() + summons[i].getWidth() - gap_radius)
                                ||
                                (summons[i].getPositionX() > entity[j].getPositionX() + entity[j].getWidth() - gap_radius)
                                ||
                                (entity[j].getPositionY() > summons[i].getPositionY() + summons[i].getHeight())
                                ||
                                (summons[i].getPositionY() > entity[j].getPositionY() + entity[j].getHeight())
                                ||
                                (entity === summons && summons[i].getPlayerity() === entity[j].getPlayerity())
                            ) continue;
                            // Actions to execute when in collision.
                            else {
                                if(entity === summons) {
                                    summons[j].setPositionY(
                                        summons[j].getPositionY() + canvas.getFieldHeight()
                                    );
                                     summons[i].setPositionY(
                                        summons[i].getPositionY() - canvas.getFieldHeight()
                                    );
                                }
                                else if(entity === players) {
                                    if(players[j].getPlayerity() === 1 && getRGBAColorValue('player', players[j], 3) >= 0 && getRGBAColorValue('player', players[j], 3) <= 1) {
                                        const new_alpha = getRGBAColorValue('player', players[j], 3) - 0.2;
                                        players[j].setColor(`rgba(0, 0, 255, ${new_alpha})`);
                                    }
                                    // Two last conditions in the below if-statement safeguard from the character reappearing after being killed and shot again.
                                    else if(players[j].getPlayerity() === 2 && getRGBAColorValue('player', players[j], 3) >= 0 && getRGBAColorValue('player', players[j], 3) <= 1) {
                                        const new_alpha = getRGBAColorValue('player', players[j], 3) - 0.2;
                                        players[j].setColor(`rgba(255, 0, 0, ${new_alpha})`);
                                    }
                                    players[j].setHealth(
                                        players[j].getHealth() - summons[i].getDamage()
                                    );
                                    if(players[j].getHealth() <= 0) alert(`Game over! Player ${players[j].getPlayerity()} has lost!`);
                                    summons.splice(i, 1);
                                    break;
                                }
                                else console.error(`CUSTOM ERROR ALERT — Unknown entity type: ${entity}.`);
                            }
                        }
                    }
                }
            }

            class Canvas {
                #width;
                #height;
                #canvas_tag;
                #canvas_context;
                #x_limit_point_one;
                #x_limit_point_two;
                #field_height;
                #blue_fields_color;
                #red_fields_color;

                constructor(canvas_tag) {
                    this.#canvas_tag = canvas_tag;
                    this.#canvas_context = canvas_tag.getContext('2d');
                    this.#width = canvas_tag.width;
                    this.#height = canvas_tag.height;
                    this.#field_height = character1.getHeight() * 2;
                    this.#blue_fields_color = 'rgba(255, 209, 0, 1)';
                    this.#red_fields_color = 'rgba(0, 255, 72, 1)';
                }

                getWidth() {
                    return this.#width;
                }
                getHeight() {
                    return this.#height;
                }
                getCanvasContext() {
                    return this.#canvas_context;
                }
                setXLimitPointOne(x_coordinate) {
                    this.#x_limit_point_one = x_coordinate;
                }
                getXLimitPointOne() {
                    return this.#x_limit_point_one;
                }
                setXLimitPointTwo(x_coordinate) {
                    this.#x_limit_point_two = x_coordinate;
                }
                getXLimitPointTwo() {
                    return this.#x_limit_point_two;
                }
                getFieldHeight() {
                    return this.#field_height;
                }
                setBlueFieldsColor(val) {
                    this.#blue_fields_color = val;
                }
                getBlueFieldsColor() {
                    return this.#blue_fields_color;
                }
                setRedFieldsColor(val) {
                    this.#red_fields_color = val;
                }
                getRedFieldsColor() {
                    return this.#red_fields_color;
                }

                setUpPlayersFieldsColor(player, player_color) {
                    const now = performance.now();

                    if(now - player.getSummoningLimitReachedTime() < player.getSummoningLimitExceedCooldown()){
                        if(player_color === 'blue') this.#canvas_context.fillStyle = '#292933';
                        else if(player_color === 'red') this.#canvas_context.fillStyle = '#332929';
                    }
                    else {
                        if(now - player.getPreviousSummoningTime() < player.getSummoningCooldown()) {
                            const alpha = getRGBAColorValue('canvas', player_color, 3);
                            /*
                                Dividing by 1000 is good for a 1 sec cooldown time; for a longer cooldown
                                time, I'd have to work on this part of the code, because after 1 sec the alpha
                                gets to value '1', but the cooldown is still blocking the summoning.

                                Solution if needed:
                                Divide by the same amount of miliseconds as is the value of the players' cooldown.
                            */
                            let remaining_cooldown_time = (now - player.getPreviousSummoningTime()) / player.getSummoningCooldown(); // To get the result in seconds.
                            const new_fields_color = [
                                getRGBAColorValue('canvas', player_color, 0),
                                getRGBAColorValue('canvas', player_color, 1),
                                getRGBAColorValue('canvas', player_color, 2),
                                remaining_cooldown_time
                            ];
                            this.#canvas_context.fillStyle = `rgba(${new_fields_color})`;
                        }
                        else {
                            if(player_color === 'blue') this.#canvas_context.fillStyle = this.getBlueFieldsColor();
                            else if(player_color === 'red') this.#canvas_context.fillStyle = this.getRedFieldsColor();
                            else console.error(`CUSTOM ERROR ALERT — Unknown player color: ${player_color}.`);
                        }
                    }
                }

                drawGameFields() {
                    let field_x = character1.getWidth() * 4;
                    this.setXLimitPointOne(field_x);
                    let field_y = 0;
                    let fields_y_count = this.getHeight() / character1.getHeight() / 2;

                    // Drawing fields for Player 1
                    this.#canvas_context.rect(0, 0, field_x, this.getHeight());
                    this.setUpPlayersFieldsColor(character1, 'blue');
                    this.#canvas_context.fill();

                    this.#canvas_context.strokeStyle = 'black';
                    this.#canvas_context.beginPath();
                    this.#canvas_context.moveTo(field_x, field_y);
                    this.#canvas_context.lineTo(field_x, this.getHeight());
                    for(let i = 1; i <= fields_y_count; i++) {
                        if(i === 10) break; // Recursion guardian
                        this.#canvas_context.moveTo(0, character1.getHeight() * 2 * i);
                        this.#canvas_context.lineTo(character1.getWidth() * 4, character1.getHeight() * 2 * i);
                    }
                    this.#canvas_context.moveTo(field_x / 2, field_y);
                    this.#canvas_context.lineTo(field_x / 2, this.getHeight());
                    this.#canvas_context.stroke();
                    this.#canvas_context.closePath()

                    // Drawing fields for Player 2
                    field_x = this.getWidth() - character2.getWidth() * 4;
                    this.setXLimitPointTwo(field_x);

                    this.#canvas_context.rect(field_x, 0, this.getWidth(), this.getHeight());
                    this.setUpPlayersFieldsColor(character2, 'red');
                    this.#canvas_context.fill();

                    this.#canvas_context.beginPath();
                    this.#canvas_context.moveTo(field_x, field_y);
                    this.#canvas_context.lineTo(field_x, this.getHeight());
                    for(let i = 1; i <= fields_y_count; i++) {
                        if(i === 10) break;
                        this.#canvas_context.moveTo(field_x, character2.getHeight() * 2 * i);
                        this.#canvas_context.lineTo(field_x + character2.getWidth() * 4, character2.getHeight() * 2 * i);
                    }
                    this.#canvas_context.moveTo(field_x + character2.getWidth() * 2, field_y);
                    this.#canvas_context.lineTo(field_x + character2.getWidth() * 2, this.getHeight());
                    this.#canvas_context.stroke();
                    this.#canvas_context.closePath()
                }

                clear() {
                    this.#canvas_context.clearRect(0, 0, this.getWidth(), this.getHeight());
                }
            }

            class Entity {
                #shape;
                #color;
                #position_x;
                #position_y;
                #width;
                #height;
                #step;
                #playerity;

                constructor(shape, color, position_x, position_y, width, height, playerity) {
                    this.#shape = shape;
                    if(color === 'blue') this.#color = 'rgba(0, 0, 255, 1)';
                    else if(color === 'red') this.#color = 'rgba(255, 0, 0, 1)';
                    else this.#color = color;
                    this.#position_x = position_x;
                    this.#position_y = position_y;
                    this.#width = width;
                    this.#height = height;
                    this.#playerity = playerity;
                }

                getShape() {
                    return this.#shape;
                }
                setColor(val) {
                    this.#color = val;
                }
                getColor() {
                    return this.#color;
                }
                getPositionX() {
                    return this.#position_x;
                }
                setPositionX(val) {
                    this.#position_x = val;
                }
                getPositionY() {
                    return this.#position_y;
                }
                setPositionY(val) {
                    this.#position_y = val;
                }
                getWidth() {
                    return this.#width;
                }
                getHeight() {
                    return this.#height;
                }
                setStep(step) {
                    this.#step = step;
                }
                getStep() {
                    return this.#step;
                }
                getPlayerity() {
                    return this.#playerity;
                }

                draw() {
                    canvas.getCanvasContext().fillStyle = this.getColor();
                    if(this.getShape() === 'triangle') {
                        canvas.getCanvasContext().beginPath();
                        canvas.getCanvasContext().moveTo(this.getPositionX() + this.#width / 2, this.getPositionY());
                        canvas.getCanvasContext().lineTo(this.getPositionX(), this.getPositionY() + this.#height);
                        canvas.getCanvasContext().lineTo(this.getPositionX() + this.#width, this.getPositionY() + this.#height);
                        canvas.getCanvasContext().lineTo(this.getPositionX() + this.#width / 2, this.getPositionY());
                        canvas.getCanvasContext().closePath();
                        canvas.getCanvasContext().fill();
                    }
                    else if(this.getShape() === 'circle') {
                        canvas.getCanvasContext().beginPath();
                        canvas.getCanvasContext().arc(this.getPositionX() + this.#width / 2, this.getPositionY() + this.#height / 2, Math.min(this.#width, this.#height) / 2, 0, Math.PI * 2);
                        canvas.getCanvasContext().closePath();
                        canvas.getCanvasContext().fill();
                    }
                    else console.error(`CUSTOM ERROR ALERT — Unknown entity shape: ${this.#shape}.`);
                }

                move(direction) {
                    if(direction === 'right') {
                        if(
                            this.getPositionX() + this.getStep() <= canvas.getWidth() &&
                            (this.getPositionX() + this.getStep() < canvas.getXLimitPointTwo() && this.getPositionX() + this.getStep() < canvas.getXLimitPointOne()
                            || this.getPositionX() + this.getStep() > canvas.getXLimitPointTwo() && this.getPositionX() + this.getStep() > canvas.getXLimitPointOne())
                        ) this.setPositionX(this.getPositionX() + this.getStep());
                    }
                    else if(direction === 'left') {
                        if(
                            this.getPositionX() - this.getStep() >= 0 &&
                            (this.getPositionX() - this.getStep() > canvas.getXLimitPointTwo() && this.getPositionX() - this.getStep() > canvas.getXLimitPointOne()
                            || this.getPositionX() - this.getStep() < canvas.getXLimitPointTwo() && this.getPositionX() - this.getStep() < canvas.getXLimitPointOne())
                        ) this.setPositionX(this.getPositionX() - this.getStep());
                    }
                    else if(direction === 'up') {
                        if(this.getPositionY() - this.getStep() >= 0) this.setPositionY(this.getPositionY() - this.getStep());
                    }
                    else if(direction === 'down') {
                        if(this.getPositionY() + this.getStep() <= canvas.getHeight()) this.setPositionY(this.getPositionY() + this.getStep());
                    }
                    else console.error(`CUSTOM ERROR ALERT — Unknown direction: ${direction}.`);
                }
            }

            class Character extends Entity {
                summon_x_position;
                #health;
                #summoning_cooldown_lesser;
                #summoning_cooldown_greater;
                #previous_summoning_time;
                #last_summon;
                #summons_limit;
                #summons_already_summoned;
                #summoning_limit_exceed_cooldown;
                #summoning_limit_reached_time;
                
                constructor(shape, color, position_x, position_y, width, height, playerity) {
                    super(shape, color, position_x, position_y, width, height, playerity);
                    this.setStep(
                        this.getHeight() * 2
                    );
                    this.#health = 100;
                    this.#summoning_cooldown_lesser = 1000; // In miliseconds.
                    this.#summoning_cooldown_greater = 3000;
                    /*
                        -Infinity, because minus plus minus gives plus, therefore any performance.now()
                        - "the lowest number possible" gives the highest number possible (it reverses the Infinity).
                        Thanks to that, the first summoning happens instantly and then is updated according
                        to the summoning cooldown.
                    */
                    this.#previous_summoning_time = -Infinity;
                    this.#summons_limit = 10;
                    this.#summons_already_summoned = 0;
                    this.#summoning_limit_exceed_cooldown = 5000;
                    this.#summoning_limit_reached_time = -Infinity;
                }

                setHealth(val) {
                    this.#health = val;
                }
                getHealth() {
                    return this.#health;
                }
                getSummoningCooldownLesser() {
                    return this.#summoning_cooldown_lesser;
                }
                getSummoningCooldownGreater() {
                    return this.#summoning_cooldown_greater;
                }
                getSummoningCooldown() {
                    if(this.getLastSummon() === 'lesser') return this.getSummoningCooldownLesser();
                    else if(this.getLastSummon() === 'greater') return this.getSummoningCooldownGreater();
                    else return 0;
                }
                setPreviousSummoningTime(val) {
                    this.#previous_summoning_time = val;
                }
                getPreviousSummoningTime() {
                    return this.#previous_summoning_time;
                }
                setLastSummon(val) {
                    this.#last_summon = val;
                }
                getLastSummon() {
                    return this.#last_summon;
                }
                getSummonsLimit() {
                    return this.#summons_limit;
                }
                setSummonsAlreadySummoned(val) {
                    this.#summons_already_summoned = val;
                }
                getSummonsAlreadySummoned() {
                    return this.#summons_already_summoned;
                }
                getSummoningLimitExceedCooldown() {
                    return this.#summoning_limit_exceed_cooldown;
                }
                setSummoningLimitReachedTime(val) {
                    this.#summoning_limit_reached_time = val;
                }
                getSummoningLimitReachedTime() {
                    return this.#summoning_limit_reached_time;
                }

                canSummon(now) {
                    let cooldown_check = false;
                    let summons_limit_check = false;

                    
                    if(now - this.getPreviousSummoningTime() >= this.getSummoningCooldown()) cooldown_check = true;

                    if(this.getSummonsAlreadySummoned() >= this.getSummonsLimit()) {
                        if(now - this.getSummoningLimitReachedTime() >= this.getSummoningLimitExceedCooldown()) {
                            this.setSummonsAlreadySummoned(0);
                            this.setSummoningLimitReachedTime(-Infinity);
                            summons_limit_check = true;
                        }
                    }
                    else {
                        summons_limit_check = true;
                    }

                    if(cooldown_check && summons_limit_check) return true;
                    else return false;
                }

                updateSummonXPosition() {
                    switch(this.getPlayerity()) {
                        case 1:
                            this.summon_x_position = this.getPositionX() + 125; // Set this up using variables?
                            break;
                        case 2:
                            this.summon_x_position = this.getPositionX() - 75; // Set this up using variables?
                            break;
                        default:
                            console.error(`CUSTOM ERROR ALERT — Unknown playerity: ${this.getPlayerity()}.`);
                    }
                }

                lesserSummon() {
                    const now = performance.now();
                    if(this.canSummon(now)) {
                        this.setPreviousSummoningTime(now);
                        this.setLastSummon('lesser');

                        let summon_color;
                        this.updateSummonXPosition();
                        if(this.getPlayerity() === 2) summon_color = '#FF7F7F'; // Lighter red.
                        else if(this.getPlayerity() === 1) summon_color = '#1E90FF'; // Lighter blue.
                        else console.error(`CUSTOM ERROR ALERT — Unknown lesser summon color: ${this.getColor()}.`);
                        summons.push(new Summon(this.getShape(), summon_color, this.summon_x_position, this.getPositionY() + this.getHeight() / 4, this.getWidth() / 2, this.getHeight() / 2, this.getPlayerity()));
                        
                        this.setSummonsAlreadySummoned(
                            this.getSummonsAlreadySummoned() + 1
                        );

                        if(this.getSummonsAlreadySummoned() === this.getSummonsLimit()) this.setSummoningLimitReachedTime(now);
                    }
                }

                greaterSummon() {
                    const now = performance.now();
                    if(this.canSummon(now)) {
                        this.setPreviousSummoningTime(now);
                        this.setLastSummon('greater');
                        
                        let summon_color;
                        this.updateSummonXPosition();
                        if(this.getPlayerity() === 2) summon_color = '#850101'; // Darker red.
                        else if(this.getPlayerity() === 1) summon_color = '#00008B'; // Darker blue
                        else console.error(`CUSTOM ERROR ALERT — Unknown greater summon color: ${this.getColor()}.`);
                        summons.push(new GreaterSummon(this.getShape(), summon_color, this.summon_x_position, this.getPositionY() + this.getHeight() / 4, this.getWidth() / 2, this.getHeight() / 2, this.getPlayerity()));
                        if(this.getShape() === 'triangle') summons.push(new GreaterSummon(this.getShape(), summon_color, this.summon_x_position, this.getPositionY() + this.getHeight() / 4 + canvas.getFieldHeight(), this.getWidth() / 2, this.getHeight() / 2, this.getPlayerity()));
                    
                        this.setSummonsAlreadySummoned(
                            this.getSummonsAlreadySummoned() + 1
                        );

                        if(this.getSummonsAlreadySummoned() === this.getSummonsLimit()) this.setSummoningLimitReachedTime(now);
                    }
                }
            }

            class Summon extends Entity {
                #isGreater;
                #movementDirection;
                #damage;

                constructor(shape, color, position_x, position_y, width, height, playerity) {
                    super(shape, color, position_x, position_y, width, height, playerity);
                    this.setStep(10);
                    this.#isGreater = false;
                    this.#damage = 20;
                    this.draw();
                    if(this.getPlayerity() === 1) this.setMovementDirection('right');
                    else if(this.getPlayerity() === 2) this.setMovementDirection('left');
                    else console.error(`CUSTOM ERROR ALERT — Unknown playerity: ${this.getPlayerity()}.`);
                }

                getIsGreater() {
                    return this.#isGreater;
                }
                setIsGreater(boolean_val) {
                    this.#isGreater = boolean_val;
                }
                getMovementDirection() {
                    return this.#movementDirection;
                }
                setMovementDirection(direction) {
                    this.#movementDirection = direction;
                }
                getDamage() {
                    return this.#damage;
                }

                move(direction) {
                    if(direction === 'right') this.setPositionX(this.getPositionX() + this.getStep());
                    else if(direction === 'left') this.setPositionX(this.getPositionX() - this.getStep());
                    else console.error(`CUSTOM ERROR ALERT — Unknown direction: ${direction}.`);
                }
            }

            // Seems like this won't be useful anymore. Will keep it here until I'm sure that's the case.
            class GreaterSummon extends Summon {
                constructor(shape, color, position_x, position_y, width, height, playerity) {
                    super(shape, color, position_x, position_y, width, height, playerity);
                    this.setIsGreater(true); // Remove isGreater altogether if this class won't be used.
                    if(this.getShape() === 'circle') this.setStep(25);
                }
            }

            const game_master = new GameMaster();

            const character1 = new Character('circle', 'blue', 50, 50, 100, 100, 1);
            const character2 = new Character('triangle', 'red', 1250, 650, 100, 100, 2);
            players.push(character1);
            players.push(character2);

            const canvas = new Canvas(document.getElementById('gameCanvas'));
            canvas.drawGameFields();

            character1.draw(0, 0);
            character2.draw(1300, 600);

            window.addEventListener('keydown', (event) => {
                /*
                    Sets a limit to movement and summoning; each action requires an individual key press.
                    Main focus with this: limiting player's movement to 1 move per press.
                */
                if(event.repeat) return;

                if(event.key === 'd') {
                    character1.move('right');
                }
                else if(event.key === 'a') {
                    character1.move('left');
                }
                else if(event.key === 'w') {
                    character1.move('up');
                }
                else if(event.key === 's') {
                    character1.move('down');
                }
                else if(event.key === 'z') {
                    character1.lesserSummon();
                }
                else if(event.key === 'x') {
                    character1.greaterSummon();
                }

                else if(event.key === 'ArrowRight') {
                    character2.move('right');
                }
                else if(event.key === 'ArrowLeft') {
                    character2.move('left');
                }
                else if(event.key === 'ArrowUp') {
                    character2.move('up');
                }
                else if(event.key === 'ArrowDown') {
                    character2.move('down');
                }
                else if(event.key === 'n') {
                    character2.lesserSummon();
                }
                else if(event.key === 'm') {
                    character2.greaterSummon();
                }
            });

            game_master.loop();
        </script>
    </body>
</html>
